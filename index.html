<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen Fight - Nostalgic Flick Pen Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="h-screen w-screen flex flex-col justify-between p-2 md:p-4 select-none">

    <header class="w-full max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-amber-500 to-orange-400 p-2.5 rounded-2xl shadow-lg text-slate-950">
                <i class="fa-solid fa-pen-nib text-2xl"></i>
            </div>

            <div>
                <h1 class="game-title text-2xl sm:text-3xl text-amber-400 tracking-wide">
                    PEN FIGHT
                </h1>
                <p class="text-xs text-slate-400 font-semibold tracking-wider uppercase">
                    Nostalgic Table Physics
                </p>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto my-2 relative flex items-center justify-center">
        <div id="canvasWrapper" class="w-full h-full relative rounded-3xl overflow-hidden border-8 border-amber-950/80 table-shadow bg-amber-900/40">
            <canvas id="gameCanvas" class="block w-full h-full cursor-crosshair"></canvas>
        </div>
    </main>

    <footer class="w-full max-w-5xl mx-auto flex items-center justify-between text-[11px] text-slate-400 px-2 py-1">
        <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-circle text-[8px] text-cyan-400"></i>
                P1: Blue Gel Pen
            </span>

            <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-circle text-[8px] text-rose-500"></i>
                P2/AI: Red Ball Pen
            </span>
        </div>

        <div class="hidden sm:block">
            <span>Friction & Physics simulated in 2D Rigid Body</span>
        </div>
    </footer>

</body>
</html>
